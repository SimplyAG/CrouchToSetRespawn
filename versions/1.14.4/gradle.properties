minecraft_version=1.14.4
fabric_version=0.28.5+1.14
loader_version=0.17.3
loader_floor=0.17.3
java_version=8
# JDK 8 is long out of support: JDK 11 compiles it at release 8, and runs the test servers.
javac_version=11
# Advancement backgrounds were texture paths before 1.21.5.
advancement_background=minecraft:textures/gui/advancements/backgrounds/adventure.png
# Advancements lived in data/<ns>/advancements/ before 1.21.
advancement_dir=advancements
# Advancement icons named the item with "item" before 1.20.5.
advancement_icon_key=item
# Fabric API this old loads a mod's data from only one of its dev folders (classes or resources); see
# dev_single_root in gradle/target-common.gradle.
dev_single_root=true
# World type name in server.properties before 1.19 (world presets got namespaced ids in 1.19).
scenario_level_type=flat
