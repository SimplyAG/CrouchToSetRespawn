// Everything both buildscripts share (build.gradle for 26.x, remap.gradle for the obfuscated targets): tests,
// resources, Java level and jar contents. Applied at the end of each.

// Server game tests (`gradlew :26.3:runGameTest`): the 50 deep tests use test APIs that only exist on the newest
// Minecraft, so only versions with server_gametest=true get the gametest source set.
def serverGameTests = (project.findProperty('server_gametest') ?: 'false') == 'true'
fabricApi {
	configureTests {
		createSourceSet = serverGameTests
		modId = "crouchtosetrespawn-gametest"
		enableGameTests = serverGameTests
		enableClientGameTests = false
		eula = true
	}
}

// Scenario test (`gradlew :<mc>:runScenarioTest`), on every version: the same bed scenarios in a real dedicated server,
// driven by a test-only mod (src/scenario). It writes build/run/scenario/scenario-result.txt and stops the server.
sourceSets {
	scenario {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}
loom {
	mods {
		register('crouchtosetrespawn') { sourceSet sourceSets.main }
		register('crouchtosetrespawn-scenario') { sourceSet sourceSets.scenario }
	}
	runs {
		register('scenario') {
			server()
			configName = 'Scenario test'
			source sourceSets.scenario
			runDir = 'build/run/scenario'
			ideConfigGenerated = false
		}
	}
}
def scenarioDir = file('build/run/scenario')
def runScenario = tasks.named('runScenario') {
	doFirst {
		// A fresh peaceful flat world every run, so earlier runs can't leak saved advancements or spawn points.
		project.delete(new File(scenarioDir, 'world'), new File(scenarioDir, 'scenario-result.txt'), new File(scenarioDir, 'config'))
		scenarioDir.mkdirs()
		// A free port per run, so several versions' scenario servers can run at the same time.
		def port = new ServerSocket(0).withCloseable { it.localPort }
		new File(scenarioDir, 'eula.txt').text = 'eula=true\n'
		new File(scenarioDir, 'server.properties').text = ['online-mode=false', "level-type=${project.findProperty('scenario_level_type') ?: 'minecraft\\:flat'}".toString(), 'difficulty=peaceful',
				'spawn-monsters=false', 'spawn-protection=0', "server-port=${port}".toString(), 'enforce-secure-profile=false', 'white-list=false',
				'generate-structures=false'].join('\n') + '\n'
	}
}
tasks.register('runScenarioTest') {
	group = 'verification'
	description = 'Runs the bed scenarios in a real dedicated server on this Minecraft version.'
	dependsOn runScenario
	doLast {
		def result = new File(scenarioDir, 'scenario-result.txt')
		if (!result.isFile()) throw new GradleException("The scenario test wrote no result; see the server log above")
		def lines = result.readLines()
		lines.each { logger.lifecycle("  ${it}") }
		if (!lines.contains('DONE') || lines.any { it.startsWith('FAIL') }) {
			throw new GradleException("Scenario test failed on Minecraft ${project.minecraft_version}")
		}
		logger.lifecycle("All ${lines.count { it.startsWith('PASS') }} scenarios passed on Minecraft ${project.minecraft_version}")
	}
}

// Every member of a release group compiles at the group lead's Java level, so its classes can be compared byte for
// byte with the lead's and the lead's jar runs on all of them.
def javaVersion = ctsrJavaVersion as int

// The advancement files differ only in format between Minecraft versions, so they are one template each, filled in
// per target. Folder: advancements/ before 1.21. Icon: {"item"} before 1.20.5. Background: a texture path before
// 1.21.5. The values come from versions/<mc>/gradle.properties (defaults are the newest format).
def advancementFormat = [
		advancement_dir       : project.findProperty('advancement_dir') ?: 'advancement',
		advancement_icon_key  : project.findProperty('advancement_icon_key') ?: 'id',
		advancement_background: project.findProperty('advancement_background') ?: 'minecraft:gui/advancements/backgrounds/adventure',
]

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dep", ctsrMinecraftDepItems
	inputs.property "java_version", javaVersion
	inputs.property "loader_floor", project.loader_floor
	inputs.properties advancementFormat

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_dep": ctsrMinecraftDepItems,
				"java_version": javaVersion,
				"loader_floor": project.loader_floor
	}

	// The shared mixins.json says JAVA_8; Mixin refuses levels the running Java can't do, so set it per target.
	filesMatching("crouchtosetrespawn.mixins.json") {
		filter { String line -> line.replace('"JAVA_8"', "\"JAVA_${javaVersion}\"") }
	}

	filesMatching("data/crouchtosetrespawn/advancement/*.json") {
		expand advancementFormat
		path = path.replace('/advancement/', "/${advancementFormat.advancement_dir}/")
	}
}

// Dev runs only: Loom runs the mod from two folders (classes and resources), and old Fabric API (1.18 and earlier)
// loads data packs from just one of them, so the mod's advancements went missing in the scenario test. Copy the
// resources in beside the classes so both folders have them. A built jar has a single root and never needs this.
if ((project.findProperty('dev_single_root') ?: 'false') == 'true') {
	// Copied whenever either task runs, so the copy is never older than the real resources (the jar takes both
	// folders, and a stale copy would win).
	def resourcesOut = tasks.named('processResources').map { it.destinationDir }
	def classesOut = tasks.named('compileJava').flatMap { it.destinationDirectory }
	def copyResources = { project.copy { from resourcesOut; into classesOut } }
	tasks.named('compileJava') { doLast { copyResources() } }
	tasks.named('processResources') {
		mustRunAfter 'compileJava'
		doLast { copyResources() }
	}
	tasks.named('jar') { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
	it.options.encoding = "UTF-8"
	// One fixed javac per target, whatever JDK runs Gradle: javac versions number lambdas differently, which would
	// make otherwise identical classes differ between a group's members.
	it.javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(ctsrJavacVersion as int) }
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
	// Each version project has its own directory, so the license comes from the root.
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

tasks.matching { it.name == 'runGameTest' || it.name == 'runScenario' }.configureEach {
	// The game runs on the group's JDK (the target's Java, or the newer one standing in for an unsupported JDK),
	// not whatever JDK runs Gradle.
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(ctsrJavacVersion as int) }
}

// Vanilla client join test: only the version it runs on stages the real dedicated server.
if (project.property('minecraft_version') == rootProject.ext.ctsrVanillaTestVersion) {
	apply from: rootProject.file('gradle/vanilla-server.gradle')
}
