// Build script for the unobfuscated Minecraft targets (26.1+): Mojang names natively, non-remapping Loom, no
// mappings. The obfuscated targets use remap.gradle instead (chosen in settings.gradle).

plugins {
	id 'dev.kikugie.stonecutter'
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Release groups and the jar allowlist; sets the ext.ctsr* values used below.
apply from: rootProject.file('gradle/release-target.gradle')

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-mc${ctsrArchiveSuffix}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Fabric Loader bundles MixinExtras only from 0.15; ship it inside the jar so @WrapOperation works on any loader.
	include implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"))
}

// Resources, Java level, jar contents and tests: shared with remap.gradle.
apply from: rootProject.file('gradle/target-common.gradle')
